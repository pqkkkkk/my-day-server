global:
  scrape_interval: 15s

scrape_configs:
  - job_name: 'my-day-server'
    metrics_path: '/actuator/prometheus'
    static_configs:
      - targets: ['host.docker.internal:8080']
  - job_name: 'postgres_exporter'
    metrics_path: '/metrics'
    static_configs:
      - targets: ['postgres_exporter:9187']
