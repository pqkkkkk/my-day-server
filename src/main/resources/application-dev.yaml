spring:
    application:
        name: my-day-server
    datasource:
        url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/my_day_db}
        username: ${DATABASE_USERNAME:postgres}
        password: ${DATABASE_PASSWORD:pqkiet854A@}
        driver-class-name: org.postgresql.Driver
        hikari:
            maximum-pool-size: 30
            minimum-idle: 10
    jpa:
        hibernate.ddl-auto: update
        show-sql: true
        properties:
            hibernate:
                dialect: org.hibernate.dialect.PostgreSQLDialect
server:
    port: 8080
    tomcat:
        threads:
            max: 200
            min-spare: 30
logging:
    level:
        root: INFO
        '[org.springframework.security]': DEBUG

management:
    endpoints:
        web:
            exposure:
                include: health,info,prometheus
    endpoint:
        prometheus:
            access: READ_ONLY

